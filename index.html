<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생태 시스템 재부팅 코어</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161b22;
            --primary-green: #00ff66;
            --alert-red: #ff3344;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--panel-bg);
            border: 2px solid var(--primary-green);
            border-radius: 8px;
            padding: 30px 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 글리치 상단 바 */
        .status-bar {
            font-size: 12px;
            color: var(--primary-green);
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(0, 255, 102, 0.3);
            padding-bottom: 8px;
        }

        h1 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 15px;
            letter-spacing: 1px;
            word-break: keep-all;
        }

        .description {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 25px;
            word-break: keep-all;
        }

        .highlight {
            color: var(--primary-green);
            font-weight: bold;
        }

        /* 입력 폼 스타일 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="password"] {
            background: #090d11;
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
            font-size: 24px;
            padding: 12px;
            text-align: center;
            letter-spacing: 10px;
            border-radius: 4px;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4), inset 0 0 10px rgba(0, 255, 102, 0.2);
        }

        button {
            background-color: var(--primary-green);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #00cc52;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }

        /* 상태 메시지 처리 */
        .message {
            min-height: 50px;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            word-break: keep-all;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background-color: rgba(255, 51, 68, 0.15);
            border: 1px solid var(--alert-red);
            color: var(--alert-red);
            animation: shake 0.3s ease-in-out;
        }

        .message.success {
            display: block;
            background-color: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--primary-green);
            color: var(--primary-green);
        }

        /* 좌우 흔들림 애니메이션 (실패 시) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <span>SYSTEM :: CORE_REBOOT</span>
        <span>STATUS :: LOCKED</span>
    </div>

    <h1>⚠️ 생태 시스템 복구 터미널</h1>
    
    <p class="description">
        파괴된 동물원의 색과 생명 에너지를 되살리기 위해<br>
        <span class="highlight">복구 비밀번호 4자리</span>를 입력해 주세요.
    </p>

    <div class="input-group">
        <input type="password" id="passwordInput" maxlength="4" placeholder="••••" autofocus autocomplete="off">
        <button onclick="checkPassword()">재부팅 승인 (ENTER)</button>
    </div>

    <div id="resultMessage" class="message"></div>
</div>

<script>
    document.getElementById("passwordInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            checkPassword();
        }
    });

    function checkPassword() {
        const input = document.getElementById("passwordInput").value;
        const messageBox = document.getElementById("resultMessage");

        if (input === "2026") {
            messageBox.className = "message success";
            messageBox.innerHTML = "✅ [복구 코드 승인 완료]<br>생태계 데이터 재부팅을 시작합니다... 복구된 동물원으로 이동합니다!";
            
            setTimeout(() => {
                // 성공 시 이동할 최종 목적지 URL이 있다면 주석(//)을 지우고 아래에 입력하세요.
                // window.location.href = "https://your-next-link.com";
            }, 1500);

        } else {
            messageBox.className = "message error";
            messageBox.innerHTML = "❌ [시스템 복구 실패]<br>올바르지 않은 비밀번호입니다. 생태 데이터가 여전히 잠겨있습니다.";
            
            document.getElementById("passwordInput").value = "";
            document.getElementById("passwordInput").focus();
        }
    }
</script>

</body>
</html>
